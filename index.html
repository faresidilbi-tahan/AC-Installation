<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abed Tahan — AC Installation Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root {
    --blue: #1a5fb4;
    --blue-dark: #154d92;
    --bg: #f5f7fa;
    --panel: #ffffff;
    --ink: #1f2937;
    --muted: #6b7280;
    --line: #d7dde5;
    --unpaid: #b45309;
    --unpaid-bg: #fff4e5;
    --paid: #15803d;
    --paid-bg: #e8f5ec;
    --danger: #b42318;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.45;
  }
  header {
    background: var(--blue);
    color: #fff;
    text-align: center;
    padding: 22px 20px 20px;
  }
  header img { width: 150px; display: block; margin: 0 auto 0px; }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .92; }
  main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 24px 60px;
    display: grid;
    grid-template-columns: 320px 1fr;
    gap: 20px;
  }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 20px;
  }
  .panel h2 { margin: 0 0 14px; font-size: 15px; font-weight: 600; }
  label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
  label:first-of-type { margin-top: 0; }
  input, textarea, select {
    width: 100%;
    font: inherit;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 4px;
    background: #fff;
    color: var(--ink);
  }
  textarea { min-height: 96px; resize: vertical; }
  input:focus, textarea:focus, select:focus, button:focus-visible {
    outline: 2px solid var(--blue);
    outline-offset: 1px;
  }
  .hint { font-size: 12px; color: var(--muted); margin-top: 4px; }
  button {
    font: inherit;
    font-weight: 600;
    padding: 9px 18px;
    border-radius: 4px;
    border: 1px solid var(--blue);
    background: var(--blue);
    color: #fff;
    cursor: pointer;
  }
  button:hover:not(:disabled) { background: var(--blue-dark); }
  button.secondary { background: #fff; color: var(--blue); }
  button.secondary:hover:not(:disabled) { background: #eef3fa; }
  button.small { padding: 4px 10px; font-size: 13px; font-weight: 500; }
  button:disabled { background: #b8c4d6; border-color: #b8c4d6; color: #fff; cursor: not-allowed; }
  .actions { margin-top: 16px; display: flex; gap: 8px; flex-wrap: wrap; }
  .search { margin-bottom: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .search input { flex: 1 1 220px; padding: 9px 12px; }
  .search select { width: auto; min-width: 150px; padding: 9px 10px; }
  .toolbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 14px;
  }
  .toolbar .count { color: var(--muted); font-size: 14px; margin-left: 10px; }
  .toolbar label { margin: 0; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-size: 14px; }
  .toolbar input[type="checkbox"] { width: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  th.pay { text-align: center; }
  td.pay { text-align: center; }
  .chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 4px 10px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    user-select: none;
  }
  .chip input { width: auto; margin: 0; cursor: pointer; }
  .chip.unpaid { background: var(--unpaid-bg); color: var(--unpaid); }
  .chip.paid { background: var(--paid-bg); color: var(--paid); cursor: default; }
  .chip.unpaid.on { outline: 2px solid var(--blue); }
  td.remove { text-align: right; }
  .empty { color: var(--muted); padding: 30px 0; text-align: center; font-size: 14px; }
  .error { color: var(--danger); font-size: 13px; margin-top: 8px; min-height: 18px; }
  .wrap { overflow-x: auto; }
</style>
</head>
<body>
<header>
  <img src="https://abedtahan.com/cdn/shop/files/AT_Logo_400x200_Transparent.png?v=1732612010&width=250" alt="Abed Tahan">
  <h1>AC Installation Tracker</h1>
  <p>Add installer invoices, then adjust payments to paid.</p>
</header>

<main id="app">
  <section class="panel">
    <h2>Add invoice</h2>
    <label for="supplierInvoice">Supplier invoice</label>
    <input id="supplierInvoice" placeholder="e.g. 28">

    <label for="installer">Installer name</label>
    <input id="installer" placeholder="e.g. Ahmad Khalil">

    <label for="tahanInvoices">Tahan invoices</label>
    <textarea id="tahanInvoices" placeholder="76002631&#10;76002952&#10;77001464"></textarea>
    <div class="hint">One per line, or separated by commas.</div>

    <div class="error" id="formError"></div>
    <div class="actions">
      <button id="addBtn">Add invoice</button>
      <button id="clearFormBtn" class="secondary">Clear</button>
    </div>
  </section>

  <section class="panel">
    <div class="search">
      <input id="search" placeholder="Search by invoice number or installer" autocomplete="off">
      <select id="installerFilter"><option value="">All installers</option></select>
      <select id="statusFilter">
        <option value="">All</option>
        <option value="install-unpaid">Installation unpaid</option>
        <option value="other-unpaid">Other unpaid</option>
        <option value="any-unpaid">Any unpaid</option>
        <option value="all-paid">Fully paid</option>
      </select>
    </div>
    <div class="toolbar">
      <div>
        <label><input type="checkbox" id="selectAll"> Select all unpaid</label>
        <span class="count" id="count"></span>
      </div>
      <button id="adjustBtn" disabled>Adjust selected</button>
    </div>
    <div class="wrap">
      <table>
        <thead>
          <tr>
            <th>Tahan invoice</th>
            <th>Supplier invoice</th>
            <th>Installer</th>
            <th class="pay">Installation payment</th>
            <th class="pay">Other payments</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
      <div class="empty" id="empty">Loading…</div>
    </div>
    <div class="error" id="listError"></div>
  </section>
</main>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbzt3NWQPf41l3Yvn5lxJg3PRKoELi0ur7G0t2YzXPoADzNQybjmlAJBtQEQiSRx16gpSA/exec';

  const TYPES = { install: 'Installation', other: 'Other' };
  let rows = [];                 // { id, tahan, supplier, installer, install, other }
  let selected = new Set();      // "id:install" / "id:other"
  const $ = id => document.getElementById(id);
  const tbody = $('rows');

  const CACHE_KEY = 'ac-tracker-rows';

  async function fetchRows() {
    const res = await fetch(API_URL);
    const data = await res.json();
    if (!data.ok) throw new Error(data.error || 'Request failed');
    return data.rows;
  }

  // Fire-and-forget write. The screen is already updated; on failure, show error and resync.
  async function send(body) {
    try {
      const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify(body) });
      const text = await res.text();
      try {
        const data = JSON.parse(text);
        if (!data.ok) throw new Error(data.error || 'Request failed');
      } catch (e) {
        if (e.message && !e.message.startsWith('Unexpected')) throw e;
        // HTML instead of JSON — write went through
      }
    } catch (e) {
      $('listError').textContent = 'Save failed: ' + e.message + ' — reloading.';
      load();
    }
  }

  function setRows(list) {
    rows = list;
    const valid = new Set();
    rows.forEach(r => {
      if (r.install === 'Unpaid') valid.add(r.id + ':install');
      if (r.other === 'Unpaid') valid.add(r.id + ':other');
    });
    selected = new Set([...selected].filter(k => valid.has(k)));
    try { localStorage.setItem(CACHE_KEY, JSON.stringify(rows)); } catch (e) {}
    refreshInstallers();
    render();
  }

  function uuid() {
    return crypto.randomUUID ? crypto.randomUUID()
      : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => {
          const r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); });
  }

  function parseList(text) {
    return text.split(/[\n,]+/).map(s => s.trim()).filter(Boolean);
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function matches(r) {
    const inst = $('installerFilter').value;
    if (inst && r.installer !== inst) return false;
    const st = $('statusFilter').value;
    if (st === 'install-unpaid' && r.install !== 'Unpaid') return false;
    if (st === 'other-unpaid' && r.other !== 'Unpaid') return false;
    if (st === 'any-unpaid' && r.install !== 'Unpaid' && r.other !== 'Unpaid') return false;
    if (st === 'all-paid' && (r.install !== 'Paid' || r.other !== 'Paid')) return false;
    const q = $('search').value.trim().toLowerCase();
    if (!q) return true;
    return [r.tahan, r.supplier, r.installer].some(v => String(v).toLowerCase().includes(q));
  }

  function refreshInstallers() {
    const sel = $('installerFilter');
    const current = sel.value;
    const names = [...new Set(rows.map(r => r.installer))].sort((a, b) => a.localeCompare(b));
    sel.innerHTML = '<option value="">All installers</option>' +
      names.map(n => `<option value="${esc(n)}">${esc(n)}</option>`).join('');
    sel.value = names.includes(current) ? current : '';
  }

  function chip(r, type) {
    const status = r[type];
    if (status === 'Paid') return `<span class="chip paid">Paid</span>`;
    const key = r.id + ':' + type;
    const on = selected.has(key);
    return `<label class="chip unpaid ${on ? 'on' : ''}">
      <input type="checkbox" data-key="${key}" ${on ? 'checked' : ''}> Unpaid
    </label>`;
  }

  function render() {
    tbody.innerHTML = '';
    const visible = rows.filter(matches);
    const empty = $('empty');
    empty.style.display = visible.length ? 'none' : 'block';
    empty.textContent = rows.length ? 'No invoices match your search.' : 'No invoices yet. Add one on the left.';
    visible.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${esc(r.tahan)}</td>
        <td>${esc(r.supplier)}</td>
        <td>${esc(r.installer)}</td>
        <td class="pay">${chip(r, 'install')}</td>
        <td class="pay">${chip(r, 'other')}</td>
        <td class="remove"><button class="small secondary" data-remove="${r.id}">Remove</button></td>`;
      tbody.appendChild(tr);
    });
    const unpaid = rows.reduce((n, r) => n + (r.install === 'Unpaid') + (r.other === 'Unpaid'), 0);
    $('count').textContent = rows.length
      ? `${rows.length} invoices · ${unpaid} unpaid payments · ${selected.size} selected`
      : '';
    $('adjustBtn').disabled = selected.size === 0;
    $('selectAll').checked = unpaid > 0 && selected.size === unpaid;
  }

  async function load() {
    $('listError').textContent = '';
    try { setRows(await fetchRows()); }
    catch (e) {
      if (!rows.length) $('empty').textContent = 'Could not load invoices.';
      $('listError').textContent = e.message;
    }
  }

  $('addBtn').onclick = async () => {
    const supplier = $('supplierInvoice').value.trim();
    const installer = $('installer').value.trim();
    const tahans = parseList($('tahanInvoices').value);
    const err = $('formError');
    err.textContent = '';
    if (!supplier) return err.textContent = 'Supplier invoice is required.';
    if (!installer) return err.textContent = 'Installer name is required.';
    if (!tahans.length) return err.textContent = 'Enter at least one Tahan invoice.';

    const existing = new Set(rows.map(r => r.tahan));
    const dupes = tahans.filter(s => existing.has(s));
    if (dupes.length) return err.textContent = `Already added: ${dupes.join(', ')}`;

    const newRows = tahans.map(tahan => ({ id: uuid(), tahan, supplier, installer, install: 'Unpaid', other: 'Unpaid' }));
    setRows([...rows, ...newRows]);
    $('supplierInvoice').value = '';
    $('installer').value = '';
    $('tahanInvoices').value = '';
    send({ action: 'add', rows: newRows });
  };

  $('clearFormBtn').onclick = () => {
    $('supplierInvoice').value = '';
    $('installer').value = '';
    $('tahanInvoices').value = '';
    $('formError').textContent = '';
  };

  tbody.addEventListener('change', e => {
    const key = e.target.dataset.key;
    if (!key) return;
    if (e.target.checked) selected.add(key); else selected.delete(key);
    render();
  });

  tbody.addEventListener('click', async e => {
    const id = e.target.dataset.remove;
    if (!id) return;
    setRows(rows.filter(r => r.id !== id));
    send({ action: 'remove', id });
  });

  $('search').oninput = render;
  $('installerFilter').onchange = render;
  $('statusFilter').onchange = render;

  $('selectAll').onchange = e => {
    selected = new Set();
    if (e.target.checked) rows.forEach(r => {
      if (r.install === 'Unpaid') selected.add(r.id + ':install');
      if (r.other === 'Unpaid') selected.add(r.id + ':other');
    });
    render();
  };

  $('adjustBtn').onclick = async () => {
    if (!selected.size) return;
    const items = [...selected].map(k => { const [id, type] = k.split(':'); return { id, type }; });
    const byId = Object.fromEntries(rows.map(r => [r.id, r]));

    const data = items.map(it => {
      const r = byId[it.id];
      return {
        'Tahan Invoice': r.tahan,
        'Supplier Invoice': r.supplier,
        'Installer': r.installer,
        'Payment': TYPES[it.type],
        'Status': 'Paid'
      };
    });
    const ws = XLSX.utils.json_to_sheet(data);
    ws['!cols'] = [{ wch: 16 }, { wch: 16 }, { wch: 24 }, { wch: 14 }, { wch: 10 }];
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Adjust');

    const d = new Date();
    const stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}_${String(d.getHours()).padStart(2,'0')}${String(d.getMinutes()).padStart(2,'0')}`;
    XLSX.writeFile(wb, `adjust_${stamp}.xlsx`);

    items.forEach(it => { byId[it.id][it.type] = 'Paid'; });
    selected = new Set();
    setRows(rows);
    send({ action: 'adjust', items });
  };

  try {
    const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || '[]');
    if (cached.length) setRows(cached);
  } catch (e) {}
  load();
</script>
</body>
</html>
